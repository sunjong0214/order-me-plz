# 통합 테스트 전용 설정 (프로필 test).
# TestFixtures.resetAndSeed 가 users/shops/carts 등 마스터 테이블을 전부 비우므로
# 벤치마크 DB(OMP)와 반드시 다른 스키마를 쓴다. TestFixtures 가 DATABASE() = OMP_TEST 를 확인하고 아니면 중단한다.
spring.datasource.url=jdbc:mysql://localhost:3306/OMP_TEST?createDatabaseIfNotExist=true
spring.datasource.username=${OMP_DB_USERNAME:root}
spring.datasource.password=${OMP_DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=create
# 테스트는 설정 조합마다 컨텍스트가 따로 캐시되고 각자 풀을 연다. 풀 20개 × 컨텍스트 여러 개가 MySQL 기본 max_connections(151)를
# 넘어 "Too many connections"로 컨텍스트 로딩이 실패했다. 테스트에 필요한 동시 커넥션은 적으므로 작게 둔다(벤치마크 설정과 무관).
spring.datasource.hikari.maximum-pool-size=5
logging.level.root=warn

# 테스트도 .env 를 읽으므로(DB 비밀번호), 파일럿 중 .env 에 넣은 튜닝 값이 테스트로 새지 않게 기본값으로 고정한다.
# 테스트별로 다른 값이 필요하면 @TestPropertySource 로 덮는다.
server.tomcat.threads.max=200
omp.review.stats.mode=sync
omp.order.async.state-ttl=5m
omp.order.async.transaction=split
omp.order.async.reject-status=503
omp.executor.insert.core=10
omp.executor.insert.max=30
omp.executor.insert.queue=100
omp.executor.review-stats.core=10
omp.executor.review-stats.max=20
omp.executor.review-stats.queue=2000
omp.executor.sse.core=10
omp.executor.sse.max=30
omp.executor.sse.queue=200
