spring.application.name=OrderMePlz
server.port=8080

# 환경마다 다른 값·튜닝 값은 리포 루트의 .env 에서 읽는다 (.env.example 참고, .env 는 추적하지 않음).
# 상대 경로라 리포 루트에서 기동해야 읽힌다. 파일이 없으면 아래 ${키:기본값}의 기본값을 쓴다.
# 우선순위: 기동 인자 > OS 환경변수 > .env > 기본값
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${OMP_DB_URL:jdbc:mysql://localhost:3306/OMP}
spring.datasource.username=${OMP_DB_USERNAME:root}
spring.datasource.password=${OMP_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.orm.jdbc.bind=
logging.level.root=warn

# cache
spring.cache.cache-names=shops,reviews

spring.datasource.hikari.maximum-pool-size=${OMP_HIKARI_MAX_POOL_SIZE:20}

spring.jpa.open-in-view=false

spring.jmx.enabled=true

management.endpoints.web.exposure.include=*
# Tomcat 스레드 지표(tomcat.threads.busy 등)는 MBean 레지스트리가 켜져 있어야 노출된다. 동기 경로의 스레드 소진을 관측하기 위함.
server.tomcat.mbeanregistry.enabled=true
# 동기 경로의 요청 스레드 수 (Spring Boot 기본 200). 커넥션 앞의 대기열 역할이다.
server.tomcat.threads.max=${OMP_TOMCAT_THREADS_MAX:200}

client-url=http://192.168.0.8:8000/api/v1/cart/webhook

# --- OMP 동작 설정 (벤치마크 환경 표에 기록) ---
# 리뷰 통계 갱신 위치: sync(채택) = 리뷰 INSERT와 같은 트랜잭션 / async(비교군) = AFTER_COMMIT 이벤트 + reviewStatsExecutor
omp.review.stats.mode=${OMP_REVIEW_STATS_MODE:sync}
# 비동기 주문 상태 보관 시간 (SSE 타임아웃 5분과 동일). 만료 후 조회는 404.
omp.order.async.state-ttl=${OMP_ORDER_ASYNC_STATE_TTL:5m}
# 비동기 주문 트랜잭션 구성: single(채택) = 접수는 DB 없이, 워커 트랜잭션 하나에서 검증 + INSERT / split(비교군) = 접수 트랜잭션에서 검증 + 워커 트랜잭션에서 INSERT
# 파일럿 P2(2026-09-27) 확정값: P = 20, insert core = max = 20, queue Q = W(약 2,940/s) × 30초 × 0.8 ≈ 70,000, review-stats core = max = P/2 = 10
omp.order.async.transaction=${OMP_ORDER_ASYNC_TRANSACTION:single}
# 대기 자리가 없을 때 응답 코드: 429(채택) / 503(비교군). Tomcat은 503 뒤 연결을 닫아 거절마다 재연결이 몰리고, 429는 연결을 유지한다
# (2026-09-28 4,000/s 비교: 503 3회 모두 붕괴, 429 붕괴 없음. benchmark/results/2026-09-26-P2 7절)
omp.order.async.reject-status=${OMP_ORDER_ASYNC_REJECT_STATUS:429}
# 동기 주문 동시 처리 상한: 0(기본, 원래 동기) / N(비교군 "동기 + 빠른 거절", 넘으면 커넥션을 기다리지 않고 즉시 거절, 응답 코드는 위 reject-status)
# 본측정 S 회차 값 120 = 동기 처리량 약 2,360/s × 허용 대기 50ms (benchmark/README.md 2절). Tomcat 스레드 수(200)보다 작아야 한다.
omp.order.sync.max-in-flight=${OMP_ORDER_SYNC_MAX_IN_FLIGHT:0}
# 비동기 풀 크기 (core/max/queue). 포화 시 거절: 주문은 429 + Retry-After, 리뷰 통계는 로그 + 카운터.
# 주문은 접수 전에 대기 자리(= insert queue 칸 수)를 예약하므로 큐가 넘치지 않고 스레드도 core를 넘어 늘지 않는다 → 측정에서는 core = max.
omp.executor.insert.core=${OMP_EXECUTOR_INSERT_CORE:20}
omp.executor.insert.max=${OMP_EXECUTOR_INSERT_MAX:20}
omp.executor.insert.queue=${OMP_EXECUTOR_INSERT_QUEUE:70000}
omp.executor.review-stats.core=${OMP_EXECUTOR_REVIEW_STATS_CORE:10}
omp.executor.review-stats.max=${OMP_EXECUTOR_REVIEW_STATS_MAX:10}
omp.executor.review-stats.queue=${OMP_EXECUTOR_REVIEW_STATS_QUEUE:2000}
omp.executor.sse.core=${OMP_EXECUTOR_SSE_CORE:10}
omp.executor.sse.max=${OMP_EXECUTOR_SSE_MAX:30}
omp.executor.sse.queue=${OMP_EXECUTOR_SSE_QUEUE:200}
