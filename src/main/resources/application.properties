spring.application.name=OrderMePlz
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/OMP
spring.datasource.username=root
spring.datasource.password=${OMP_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.orm.jdbc.bind=
logging.level.root=warn

# cache
spring.cache.cache-names=shops,reviews

spring.datasource.hikari.maximum-pool-size=20

spring.jpa.open-in-view=false

spring.jmx.enabled=true

management.endpoints.web.exposure.include=*

client-url=http://192.168.0.8:8000/api/v1/cart/webhook

# --- OMP 동작 설정 (벤치마크 환경 표에 기록) ---
# 리뷰 통계 갱신 위치: sync(채택) = 리뷰 INSERT와 같은 트랜잭션 / async(비교군) = AFTER_COMMIT 이벤트 + reviewStatsExecutor
omp.review.stats.mode=sync
# 비동기 주문 상태 보관 시간 (SSE 타임아웃 5분과 동일). 만료 후 조회는 404.
omp.order.async.state-ttl=5m
# 비동기 풀 크기 (core/max/queue). 포화 시 거절: 주문은 503 + Retry-After, 리뷰 통계는 로그 + 카운터.
omp.executor.insert.core=10
omp.executor.insert.max=30
omp.executor.insert.queue=100
omp.executor.review-stats.core=10
omp.executor.review-stats.max=20
omp.executor.review-stats.queue=2000
